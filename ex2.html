<html>
<body>
    <script>
        function my_bin(number) {
            let bits = "";
            while (number > 0) {
                let bit = number % 2;
                bits = bit + bits;
                number = Math.floor(number / 2);
            }
            return bits
        }

        let a = my_bin(10);
        alert(a);
    </script>
</body>
</html>

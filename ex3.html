<html>

<body>
    <script>
        function pascal_triangle(n) {
            let triangle = [];

            for (let i = 0; i < n; i++) {
                let row = new Array(i + 1).fill(1);

                for (let j = 1; j < i; j++) {
                    row[j] = triangle[i - 1][j - 1] + triangle[i - 1][j];
                }

                triangle.push(row);
            }

            return triangle;
        }

        let rows = Number(prompt("Enter number of rows:"));
        let triangle = pascal_triangle(rows);

        for (let i = 0; i < triangle.length; i++) {
            let row = triangle[i].join(" ");
            let spaces = " ".repeat((rows - i) * 2);
            document.write(spaces + row + "<br>");
        }
    </script>
</body>

</html>

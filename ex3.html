<html>

<body>
    <script>
        let set1 = new Set([1, 2, 3]);
        let set2 = new Set([1, 3, 4, 5]);
        let set3 = new Set();

        for (let el of set1) {
            if (set2.has(el)) {
                set3.add(el);
            }
        }

        console.log(set3);
        alert([...set3]);
    </script>
</body>

</html>

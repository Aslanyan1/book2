<html>

<body>
    <script>
        let arr = [];
        let count = 0;
        let len1 = Number(prompt("Enter a len: "));

        for (let i = 0; i < len1; i++) {
            let number = Number(prompt("Enter a number"));
            arr.push(number);
        }

        for (let el of arr) {
            count += el;
        }
        let arithmetic_mean = count / len1;
        alert(count);
        alert(arithmetic_mean);
    </script>
</body>

</html>

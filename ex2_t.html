<html>

<body>
    <script>
        let arr = [1, 5, 4, 5, 7, 5, 9, 8]
        let number = Number(prompt("Enter the number"))
        let count = 0
        for (let el of arr) {
            if (el == number) {
                count++
            }
        }
        alert(count)
    </script>
</body>

</html>
